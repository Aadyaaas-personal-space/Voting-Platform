<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Registration - SmartVote</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      padding: 20px;
    }
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 8px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .container {
      max-width: 1000px;
      margin: 80px auto;
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo img {
      width: 70px;
    }
    .logo h2 {
      margin-top: 10px;
    }
    .row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .row input, .row select {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      min-height: 80px;
      margin-bottom: 20px;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
    }
    .login-link {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
    .login-link a {
      color: #2563eb;
      text-decoration: none;
    }
    .popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 20px 30px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      border-radius: 10px;
      text-align: center;
      z-index: 1000;
    }
    .popup button {
      margin-top: 10px;
      padding: 8px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button class="back-btn" onclick="window.location.href='UserLogin.html'">Back</button>

  <div class="container">
    <div class="logo">
      <img src="https://play-lh.googleusercontent.com/7cl4P-UE0QOJxLawN15ZZuCbKMdt-Wn96tNkPmf7MPtWKnErlDYIzhs27xE8UeHNYdY" alt="Logo">
      <h2>Registration</h2>
    </div>

    <center><p class="tagline">"Your Identity, Your Right — Register With Confidence."</p></center>

    <div class="row">
      <input type="text" placeholder="First Name">
      <input type="text" placeholder="Middle Name">
      <input type="text" placeholder="Last Name">
    </div>

    <div class="row">
      <input type="text" placeholder="Phone Number">
      <input type="date" placeholder="DOB">
      <input type="text" placeholder="Aadhar Card Number">
    </div>

    <div class="row">
      <input type="text" placeholder="Voter ID">
      <input type="password" placeholder="Password">
    </div>

    <textarea placeholder="Address Line 1"></textarea>
    <textarea placeholder="Address Line 2"></textarea>
    <textarea placeholder="Address Line 3"></textarea>

    <div class="row">
      <input type="text" placeholder="City">
      <input type="text" placeholder="Pincode">
      <input type="text" placeholder="Nationality">
    </div>

    <div class="row">
    <select>
        <option selected disabled>Select Election</option>
        <option>AAMDAAR</option>
        <option>KHASDAAR</option>
        <option>NAGARSEVAK</option>
        <option>NAGAR-ADHAKSHYA</option>
        <option>UNION</option>
        <option>PRIME MINISTER</option>
        <option>CABBINET-MINISTRY</option>
        <option>SYNICATE</option>
    </select>
</div>

    <button class="btn-primary" onclick="showPopup()">Register</button>

    <div class="login-link">
      Already have an account? <a href="UserLogin.html">Login</a>
    </div>
  </div>

  <div class="popup" id="popup">
    <h3>Request Submitted!</h3>
    <p>Your request has been submitted.  
      It is under scrutiny.  
      You will be notified once approved.</p>
    <button onclick="window.location.href='index.html'">OK</button>
  </div>

  <script>
    function showPopup() {
      document.getElementById('popup').style.display = 'block';
    }
  </script>

</body>
</html>
