<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Login - SmartVote</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 8px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .container {
      background: #ffffff;
      width: 380px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      text-align: center;
    }

    .logo img {
      width: 60px;
    }

    .logo h2 {
      margin-top: 10px;
    }

    input {
      width: 90%;
      padding: 12px;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .btn-primary {
      margin-top: 20px;
      width: 95%;
      padding: 12px;
      border: none;
      background: #2563eb;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 17px;
    }

    .btn-primary:hover {
      background: #1e40af;
    }

    .register-link {
      margin-top: 15px;
      font-size: 14px;
    }

    .register-link a {
      color: #2563eb;
      text-decoration: none;
    }

    /* Popup */
    #popup {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    #popup-box {
      background: #fff;
      width: 320px;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
    }

    #popup-box h3 {
      margin-bottom: 12px;
      font-size: 20px;
    }

    #popup-box p {
      font-size: 15px;
      color: #444;
      line-height: 1.4;
    }

    #popup-box button {
      margin-top: 18px;
      padding: 10px 20px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #popup-box button:hover {
      background: #1e40af;
    }
  </style>
</head>
<body>

  <button class="back-btn" onclick="window.location.href='index.html'">Back</button>

  <div class="container">
    <div class="logo">
      <img src="https://play-lh.googleusercontent.com/7cl4P-UE0QOJxLawN15ZZuCbKMdt-Wn96tNkPmf7MPtWKnErlDYIzhs27xE8UeHNYdY" alt="Platform Logo">
      <h2>Login</h2>
    </div>

    <p class="tagline">"Every vote is a voice — make yours count."</p>

    <input type="text" placeholder="Voter ID" />
    <input type="password" placeholder="Password" />

    <div class="row">
    <select>
        <option selected disabled>Select Election</option>
        <option>AAMDAAR</option>
        <option>KHASDAAR</option>
        <option>NAGARSEVAK</option>
        <option>NAGAR-ADHAKSHYA</option>
        <option>UNION</option>
        <option>PRIME MINISTER</option>
        <option>CABBINET-MINISTRY</option>
        <option>SYNICATE</option>
    </select>
</div>


    <button class="btn-primary" onclick="showPopup()">Login</button>

    <div class="register-link">
      Not registered? <a href="UserRegister.html">Create an account</a>
    </div>
  </div>

  <!-- Popup -->
  <div id="popup">
    <div id="popup-box">
      <h3>Login Succcessfully!!!</h3>
      <button onclick="closePopup()">OK</button>
    </div>
  </div>

<script>
  function showPopup() {
    document.getElementById("popup").style.display = "flex";
  }

  function closePopup() {
    window.location.href = "UserDashboard.html";
  }
</script>

</body>
</html>
